name: Build UK food data (CoFID)

# Downloads McCance and Widdowson's CoFID spreadsheet from gov.uk and
# regenerates data/cofid.js. Run manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Download CoFID
        run: python scripts/fetch_cofid.py /tmp/cofid.xlsx
      - name: Build data/cofid.js
        run: python scripts/build_cofid.py /tmp/cofid.xlsx data/cofid.js
      - name: Commit if changed
        run: |
          git add data/cofid.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UK CoFID food data"
          git push
